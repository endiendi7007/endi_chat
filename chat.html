<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chat – Endi's Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
      document.body.classList.remove('dark');
      document.body.classList.add('light');
    } else {
      document.body.classList.remove('light');
      document.body.classList.add('dark');
    }
  </script>

  <header class="top-bar">
    <span class="logo">Endi's Chat</span>
    <div class="top-bar-right">
      <span id="connectionStatus" class="connection-status pending">Connecting…</span>
      <a href="settings.html" class="icon-btn" aria-label="Settings">
        <img src="pictures/darksettings.png" class="theme-icon dark-icon" alt="Settings">
        <img src="pictures/lightsettings.png" class="theme-icon light-icon" alt="Settings">
      </a>
    </div>
  </header>

  <main class="chat-box" id="chatBox"></main>

  <div class="chat-input-area">
    <button id="plusBtn" aria-label="Attach" type="button">+</button>
    <input type="text" id="messageInput" placeholder="Type a message…" autocomplete="off" maxlength="2000" disabled>
    <button id="sendBtn" aria-label="Send" type="button" disabled>
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
        <path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576zm6.787-8.201L1.591 6.602l4.339 2.76z"/>
      </svg>
    </button>
  </div>

  <!-- Bottom sheet -->
  <div class="bottom-sheet-overlay" id="bottomSheetOverlay"></div>
  <div class="bottom-sheet" id="bottomSheet">
    <div class="bottom-sheet-handle"></div>
    <button class="sheet-option" id="photoOption" type="button">
      <span class="sheet-icon">🖼️</span>
      <span>Photos</span>
    </button>
    <button class="sheet-option" id="documentOption" type="button">
      <span class="sheet-icon">📄</span>
      <span>Documents</span>
    </button>
  </div>

  <input type="file" id="photoInput" accept="image/*" multiple hidden>
  <input type="file" id="documentInput" accept=".pdf,.doc,.docx,.txt,.zip,.png,.jpg,.jpeg,.gif,.webp" multiple hidden>

  <script src="config.js"></script>
  <script src="chat.js"></script>
</body>
</html>
