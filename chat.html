<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Endi's Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

  <!-- Immediate Theme Initializer (Prevents flashing) -->
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
      document.body.classList.remove('dark');
      document.body.classList.add('light');
    } else {
      document.body.classList.remove('light');
      document.body.classList.add('dark');
    }
  </script>

  <!-- Top Bar Header (Imported from Login page) -->
  <header class="top-bar">
    <span class="logo">Endi's Chat</span>

    <!-- Direct Link to Settings Page -->
    <a href="settings.html" class="icon-btn" aria-label="Settings">
      <img src="pictures/darksettings.png" class="theme-icon dark-icon" alt="Dark Settings">
      <img src="pictures/lightsettings.png" class="theme-icon light-icon" alt="Light Settings">
    </a>
  </header>

  <!-- Chat Interface Container -->
  <main class="chat-container">
    <div class="chat-wrapper">
      
      <!-- Messages Area -->
      <div id="chat-messages" class="chat-messages">
        <!-- Messages will dynamically load here -->
      </div>

      <!-- Message Input Form -->
      <form id="chat-form" class="chat-form">
        <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off" required>
        <button type="submit" id="send-btn" class="submit-btn">Send</button>
      </form>

    </div>
  </main>

  <!-- Optional: Chat logic script later -->
  <!-- <script src="chat.js"></script> -->
</body>
</html>
